# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Identity.Dapper.Oracle11g CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        cache: true

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Package
      run: dotnet build --no-restore --configuration Release /p:Version=1.0.${{ github.run_number }}

    - name: Run Tests
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Pack NuGet Package
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: dotnet pack --no-build --configuration Release /p:Version=1.0.${{ github.run_number }} --output ./dist

    - name: Push to NuGet Registry via Trusted Publisher
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: dotnet nuget push "./dist/*.nupkg" --source https://nuget.org --skip-duplicate
